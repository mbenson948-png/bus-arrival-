<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Departure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
            padding: 15px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .header h1 { font-size: 20px; }
        .gear {
            width: 35px;
            height: 35px;
            border: 2px solid #000;
            text-align: center;
            line-height: 31px;
            font-size: 22px;
            cursor: pointer;
        }

        /* Main departure display */
        .next-departure {
            border: 4px solid #000;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        .next-departure .mode {
            font-size: 14px;
            font-weight: bold;
            background: #000;
            color: #fff;
            display: inline-block;
            padding: 3px 10px;
            margin-bottom: 10px;
        }
        .next-departure .route {
            font-size: 64px;
            font-weight: bold;
            line-height: 1;
        }
        .next-departure .destination {
            font-size: 18px;
            margin-top: 5px;
            font-weight: bold;
        }
        .next-departure .time {
            font-size: 48px;
            font-weight: bold;
            margin-top: 10px;
        }
        .next-departure .platform {
            font-size: 14px;
            margin-top: 10px;
        }

        /* Later departures */
        .later {
            border: 2px solid #000;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .later .info { flex: 1; }
        .later .route {
            font-size: 28px;
            font-weight: bold;
        }
        .later .destination {
            font-size: 12px;
        }
        .later .time {
            font-size: 24px;
            font-weight: bold;
            text-align: right;
        }
        .later .mode {
            font-size: 10px;
            background: #000;
            color: #fff;
            padding: 2px 6px;
            display: inline-block;
        }

        /* Footer */
        .footer {
            border-top: 2px solid #000;
            padding-top: 8px;
            margin-top: 15px;
            font-size: 11px;
            font-weight: bold;
        }

        /* Status messages */
        .status {
            text-align: center;
            padding: 40px 20px;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid #000;
        }
        .hidden { display: none; }

        /* Settings overlay */
        .settings-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #fff;
            padding: 15px;
            overflow-y: auto;
        }
        .settings-overlay.show { display: block; }
        .settings-overlay h2 {
            font-size: 18px;
            border-bottom: 3px solid #000;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #000;
        }
        .btn {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #000;
            background: #000;
            color: #fff;
            cursor: pointer;
            margin-right: 8px;
            margin-top: 10px;
        }
        .btn.secondary {
            background: #fff;
            color: #000;
        }
        .msg {
            padding: 10px;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid #000;
            margin-bottom: 15px;
            text-align: center;
        }
        .msg.error { background: #000; color: #fff; }

        /* Stop list */
        .stop-list {
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #000;
            margin-top: 10px;
        }
        .stop-item {
            padding: 10px;
            border-bottom: 1px solid #000;
            cursor: pointer;
            font-size: 14px;
        }
        .stop-item:hover, .stop-item.selected {
            background: #000;
            color: #fff;
        }
        .stop-item .stop-name { font-weight: bold; }
        .stop-item .stop-parent { font-size: 11px; }
    </style>
</head>
<body>
    <!-- Settings -->
    <div id="settings" class="settings-overlay">
        <h2>SETTINGS</h2>
        <div id="msg" class="msg hidden"></div>

        <div class="form-group">
            <label>SEARCH FOR YOUR STOP</label>
            <input type="text" id="searchInput" placeholder="e.g. Chatswood, Central, Circular Quay">
        </div>
        <button class="btn" onclick="doSearch()">SEARCH</button>

        <div id="stopList" class="stop-list hidden"></div>

        <div class="form-group" style="margin-top:20px;">
            <label>SELECTED STOP</label>
            <input type="text" id="selectedStop" readonly placeholder="Search and select a stop above">
        </div>

        <div style="margin-top:20px;">
            <button class="btn" onclick="saveSettings()">SAVE</button>
            <button class="btn secondary" onclick="closeSettings()">CANCEL</button>
        </div>
    </div>

    <!-- Main Display -->
    <div id="main">
        <div class="header">
            <h1>NEXT DEPARTURE</h1>
            <div class="gear" onclick="openSettings()">⚙</div>
        </div>

        <div id="loading" class="status">LOADING...</div>
        <div id="error" class="status hidden"></div>
        <div id="noConfig" class="status hidden">TAP ⚙ TO SET YOUR STOP</div>

        <div id="departures" class="hidden">
            <div id="nextDep" class="next-departure">
                <div class="mode">BUS</div>
                <div class="route">--</div>
                <div class="destination">--</div>
                <div class="time">-- min</div>
                <div class="platform"></div>
            </div>
            <div id="laterDeps"></div>
        </div>

        <div class="footer">
            UPDATED: <span id="updated">--:--</span> · <span id="stopName">--</span>
        </div>
    </div>

    <script>
        // State
        var config = {
            stopId: '',
            stopName: ''
        };
        var selectedStop = null;

        // Load config from localStorage
        function loadConfig() {
            try {
                var saved = localStorage.getItem('transport_config');
                if (saved) {
                    config = JSON.parse(saved);
                }
            } catch(e) {}
        }

        // Save config
        function saveConfig() {
            try {
                localStorage.setItem('transport_config', JSON.stringify(config));
            } catch(e) {}
        }

        // Show/hide elements
        function show(id) {
            var el = document.getElementById(id);
            el.className = el.className.replace(' hidden', '').replace('hidden', '');
        }
        function hide(id) {
            var el = document.getElementById(id);
            if (el.className.indexOf('hidden') === -1) {
                el.className += ' hidden';
            }
        }

        // Format time
        function formatTime() {
            var d = new Date();
            return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        }

        // Show message in settings
        function showMsg(text, isError) {
            var el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'msg' + (isError ? ' error' : '');
        }
        function hideMsg() {
            document.getElementById('msg').className = 'msg hidden';
        }

        // API request
        function apiGet(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            callback(null, JSON.parse(xhr.responseText));
                        } catch(e) {
                            callback('Invalid response', null);
                        }
                    } else {
                        callback('Request failed', null);
                    }
                }
            };
            xhr.open('GET', url, true);
            xhr.send();
        }

        // Search for stops
        function doSearch() {
            var query = document.getElementById('searchInput').value.trim();
            if (!query) {
                showMsg('Enter a stop name', true);
                return;
            }

            showMsg('Searching...', false);
            hide('stopList');

            apiGet('/api/stops?q=' + encodeURIComponent(query), function(err, data) {
                if (err) {
                    showMsg('Search failed: ' + err, true);
                    return;
                }

                if (!data.stops || data.stops.length === 0) {
                    showMsg('No stops found', true);
                    return;
                }

                showMsg('Found ' + data.stops.length + ' stops', false);

                var list = document.getElementById('stopList');
                list.innerHTML = '';

                for (var i = 0; i < data.stops.length; i++) {
                    var stop = data.stops[i];
                    var div = document.createElement('div');
                    div.className = 'stop-item';
                    div.innerHTML = '<div class="stop-name">' + stop.name + '</div>' +
                        '<div class="stop-parent">' + (stop.parent || '') + ' · ' + stop.type + '</div>';
                    div.onclick = (function(s) {
                        return function() { selectStop(s); };
                    })(stop);
                    list.appendChild(div);
                }

                show('stopList');
            });
        }

        // Select a stop
        function selectStop(stop) {
            selectedStop = stop;
            document.getElementById('selectedStop').value = stop.name + (stop.parent ? ' (' + stop.parent + ')' : '');

            // Highlight selected
            var items = document.querySelectorAll('.stop-item');
            for (var i = 0; i < items.length; i++) {
                items[i].className = 'stop-item';
            }
            event.target.closest('.stop-item').className = 'stop-item selected';

            showMsg('Selected: ' + stop.name, false);
        }

        // Save settings
        function saveSettings() {
            if (!selectedStop) {
                showMsg('Please select a stop first', true);
                return;
            }

            config.stopId = selectedStop.id;
            config.stopName = selectedStop.name + (selectedStop.parent ? ' (' + selectedStop.parent + ')' : '');
            saveConfig();
            closeSettings();
            fetchDepartures();
        }

        // Settings panel
        function openSettings() {
            hideMsg();
            document.getElementById('searchInput').value = '';
            document.getElementById('selectedStop').value = config.stopName || '';
            hide('stopList');
            selectedStop = null;
            document.getElementById('settings').className = 'settings-overlay show';
        }

        function closeSettings() {
            document.getElementById('settings').className = 'settings-overlay';
        }

        // Fetch departures
        function fetchDepartures() {
            if (!config.stopId) {
                hide('loading');
                hide('error');
                hide('departures');
                show('noConfig');
                return;
            }

            show('loading');
            hide('error');
            hide('departures');
            hide('noConfig');

            apiGet('/api/departures?stopId=' + encodeURIComponent(config.stopId), function(err, data) {
                hide('loading');

                if (err) {
                    document.getElementById('error').textContent = err;
                    show('error');
                    return;
                }

                if (!data.departures || data.departures.length === 0) {
                    document.getElementById('error').textContent = 'NO DEPARTURES FOUND';
                    show('error');
                    return;
                }

                displayDepartures(data.departures);
            });
        }

        // Display departures
        function displayDepartures(departures) {
            var next = departures[0];

            // Update next departure
            var nextEl = document.getElementById('nextDep');
            nextEl.querySelector('.mode').textContent = next.mode.toUpperCase();
            nextEl.querySelector('.route').textContent = next.route;
            nextEl.querySelector('.destination').textContent = next.destination || '';
            nextEl.querySelector('.time').textContent = next.minutes <= 0 ? 'NOW' : next.minutes + ' min';
            nextEl.querySelector('.platform').textContent = next.platform ? 'Platform ' + next.platform : '';

            // Later departures
            var laterEl = document.getElementById('laterDeps');
            laterEl.innerHTML = '';

            for (var i = 1; i < Math.min(5, departures.length); i++) {
                var dep = departures[i];
                var div = document.createElement('div');
                div.className = 'later';
                div.innerHTML =
                    '<div class="info">' +
                        '<span class="mode">' + dep.mode.toUpperCase() + '</span> ' +
                        '<span class="route">' + dep.route + '</span>' +
                        '<div class="destination">' + (dep.destination || '') + '</div>' +
                    '</div>' +
                    '<div class="time">' + (dep.minutes <= 0 ? 'NOW' : dep.minutes + ' min') + '</div>';
                laterEl.appendChild(div);
            }

            show('departures');
            document.getElementById('updated').textContent = formatTime();
            document.getElementById('stopName').textContent = config.stopName || '';
        }

        // E-ink refresh (flash black then white)
        function flashRefresh() {
            document.body.style.background = '#000';
            setTimeout(function() {
                document.body.style.background = '#fff';
            }, 150);
        }

        // Initialize
        function init() {
            loadConfig();

            if (config.stopId) {
                fetchDepartures();
            } else {
                hide('loading');
                show('noConfig');
            }

            // Auto refresh every minute
            setInterval(fetchDepartures, 60000);

            // E-ink flash refresh every 5 minutes
            setInterval(flashRefresh, 300000);

            // Enter key in search
            document.getElementById('searchInput').onkeypress = function(e) {
                if (e.key === 'Enter') doSearch();
            };
        }

        init();
    </script>
</body>
</html>
