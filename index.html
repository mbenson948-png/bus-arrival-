<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transit Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;700&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Archivo', Arial, sans-serif;
            background: #fff;
            color: #000;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
        }

        /* Main container - 800x480 e-ink panel */
        .board {
            width: 800px;
            height: 480px;
            background: #fff;
            color: #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header bar */
        .header {
            background: #000;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
        }
        .header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .stop-name {
            font-weight: 900;
            font-stretch: 125%;
            font-size: 34px;
            line-height: 1;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .stop-detail {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        /* Clock display */
        .clock {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .clock-char {
            position: relative;
            height: 52px;
            background: #fff;
            color: #000;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 700;
            font-size: 36px;
        }
        .clock-char.digit { width: 34px; }
        .clock-char.colon { width: 16px; }
        .clock-char::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 25px;
            height: 2px;
            background: #000;
        }

        /* Column headers */
        .col-headers {
            display: grid;
            grid-template-columns: 150px 1fr 170px;
            gap: 16px;
            padding: 10px 24px 4px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.18em;
        }
        .col-headers .right { text-align: right; }

        /* Departure rows */
        .rows {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 24px;
            overflow: hidden;
        }
        .row {
            display: grid;
            grid-template-columns: 150px 1fr 170px;
            gap: 16px;
            align-items: center;
            height: 62px;
            border-top: 2px solid #000;
            cursor: pointer;
        }

        /* Route number - split flap tiles */
        .route-tiles {
            display: flex;
            gap: 3px;
        }
        .tile {
            position: relative;
            width: 34px;
            height: 44px;
            background: #000;
            color: #fff;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 700;
            font-size: 28px;
        }
        .tile::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 21px;
            height: 2px;
            background: #fff;
        }

        /* Destination info */
        .dest-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .dest-name {
            font-weight: 800;
            font-stretch: 112%;
            font-size: 23px;
            line-height: 1.05;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
        }
        .dest-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border: 2px solid #000;
        }
        .status-dot.live { background: #000; }
        .status-dot.timetable { background: #fff; }

        /* Time display */
        .time-display {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 3px;
        }
        .time-tiles {
            display: flex;
            gap: 3px;
        }
        .time-unit {
            width: 40px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.1em;
            padding-left: 4px;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 8px 24px;
            border-top: 4px solid #000;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.1em;
        }
        .alert {
            background: #000;
            color: #fff;
            padding: 3px 10px;
        }
        .updated {
            margin-left: auto;
        }
        .footer-legend {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Status messages */
        .status-msg {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* Settings overlay */
        .settings-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #fff;
            padding: 24px;
            overflow-y: auto;
            z-index: 100;
        }
        .settings-overlay.show { display: block; }
        .settings-overlay h2 {
            font-size: 24px;
            font-weight: 900;
            font-stretch: 125%;
            border-bottom: 4px solid #000;
            padding-bottom: 8px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #000;
            font-family: 'IBM Plex Mono', monospace;
        }
        .btn {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.1em;
            border: 2px solid #000;
            background: #000;
            color: #fff;
            cursor: pointer;
            margin-right: 8px;
            text-transform: uppercase;
        }
        .btn.secondary {
            background: #fff;
            color: #000;
        }
        .msg {
            padding: 10px;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid #000;
            margin-bottom: 16px;
            text-align: center;
        }
        .msg.error { background: #000; color: #fff; }
        .stop-list {
            max-height: 200px;
            overflow-y: auto;
            border: 2px solid #000;
            margin-top: 8px;
        }
        .stop-item {
            padding: 10px;
            border-bottom: 1px solid #000;
            cursor: pointer;
            font-size: 14px;
        }
        .stop-item:last-child { border-bottom: none; }
        .stop-item.selected { background: #000; color: #fff; }
        .stop-item .stop-name { font-weight: 700; }
        .stop-item .stop-parent { font-size: 11px; margin-top: 2px; }

        /* Mode filters */
        .mode-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .mode-filter {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border: 2px solid #000;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }
        .mode-filter input { width: auto; margin-right: 6px; }
        .mode-filter.checked { background: #000; color: #fff; }

        /* Settings button */
        .settings-btn {
            position: absolute;
            top: 14px;
            right: 24px;
            width: 40px;
            height: 40px;
            background: #fff;
            border: 2px solid #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .settings-btn:hover { background: #ccc; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Settings -->
    <div id="settings" class="settings-overlay">
        <h2>Settings</h2>
        <div id="msg" class="msg hidden"></div>

        <div class="form-group">
            <label>Search for your stop (name or number)</label>
            <input type="text" id="searchInput" placeholder="e.g. Gladesville, 2000105">
        </div>
        <button class="btn" onclick="doSearch()">SEARCH</button>

        <div id="stopList" class="stop-list hidden"></div>

        <div class="form-group" style="margin-top:20px;">
            <label>Selected stop</label>
            <input type="text" id="selectedStop" readonly placeholder="Search and select above">
        </div>

        <div class="form-group">
            <label>Show transport types</label>
            <div class="mode-filters">
                <label class="mode-filter checked" data-mode="bus">
                    <input type="checkbox" checked> Bus
                </label>
                <label class="mode-filter checked" data-mode="train">
                    <input type="checkbox" checked> Train
                </label>
                <label class="mode-filter checked" data-mode="ferry">
                    <input type="checkbox" checked> Ferry
                </label>
                <label class="mode-filter checked" data-mode="metro">
                    <input type="checkbox" checked> Metro
                </label>
                <label class="mode-filter" data-mode="schoolbus">
                    <input type="checkbox"> School
                </label>
            </div>
        </div>

        <div style="margin-top:20px;">
            <button class="btn" onclick="saveSettings()">SAVE</button>
            <button class="btn secondary" onclick="closeSettings()">CANCEL</button>
        </div>
    </div>

    <!-- Main Board -->
    <div class="board" id="board">
        <div class="header">
            <div class="header-left">
                <div class="stop-name" id="headerStopName">LOADING</div>
                <div class="stop-detail" id="headerStopDetail">TAP ⚙ TO CONFIGURE</div>
            </div>
            <button class="settings-btn" onclick="openSettings()">⚙</button>
            <div class="clock" id="clock"></div>
        </div>

        <div class="col-headers">
            <div>ROUTE</div>
            <div>DESTINATION</div>
            <div class="right">DEPARTS</div>
        </div>

        <div class="rows" id="rows">
            <div id="loading" class="status-msg">LOADING...</div>
            <div id="error" class="status-msg hidden"></div>
            <div id="noConfig" class="status-msg hidden">TAP ⚙ TO SET STOP</div>
        </div>

        <div class="footer">
            <div id="alertBar" class="alert hidden"></div>
            <div class="footer-legend">
                <span class="status-dot live"></span>LIVE
                <span class="status-dot timetable" style="margin-left:8px"></span>TIMETABLE
            </div>
            <div class="updated">UPDATED <span id="updated">--:--</span></div>
        </div>
    </div>

    <script>
        // Mode definitions
        var MODES = {
            1: { name: 'Train', key: 'train' },
            2: { name: 'Metro', key: 'metro' },
            4: { name: 'Light Rail', key: 'metro' },
            5: { name: 'Bus', key: 'bus' },
            7: { name: 'Coach', key: 'bus' },
            9: { name: 'Ferry', key: 'ferry' },
            11: { name: 'School Bus', key: 'schoolbus' }
        };

        // State
        var config = {
            stopId: '',
            stopName: '',
            stopDetail: '',
            modes: ['bus', 'train', 'ferry', 'metro']
        };
        var selectedStop = null;
        var currentDepartures = [];

        // Load config
        function loadConfig() {
            try {
                var saved = localStorage.getItem('transit_board_config');
                if (saved) config = JSON.parse(saved);
            } catch(e) {}
        }

        // Save config
        function saveConfig() {
            try {
                localStorage.setItem('transit_board_config', JSON.stringify(config));
            } catch(e) {}
        }

        // Show/hide
        function show(id) { document.getElementById(id).classList.remove('hidden'); }
        function hide(id) { document.getElementById(id).classList.add('hidden'); }

        // Format time HH:MM
        function formatTime() {
            var d = new Date();
            return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        }

        // Update clock display
        function updateClock() {
            var time = formatTime();
            var chars = time.split('');
            var html = '';
            chars.forEach(function(ch) {
                var cls = ch === ':' ? 'clock-char colon' : 'clock-char digit';
                html += '<div class="' + cls + '">' + ch + '</div>';
            });
            document.getElementById('clock').innerHTML = html;
        }

        // Create split-flap tiles for route
        function createRouteTiles(route) {
            var padded = route.toString().padEnd(3, ' ');
            var html = '';
            padded.split('').forEach(function(ch) {
                html += '<div class="tile">' + ch + '</div>';
            });
            return html;
        }

        // Create time tiles
        function createTimeTiles(minutes) {
            var text, unit;
            if (minutes <= 1) {
                text = 'DUE';
                unit = '';
            } else if (minutes < 60) {
                text = String(minutes);
                unit = 'MIN';
            } else {
                // Show clock time for > 60 min
                var now = new Date();
                var dep = new Date(now.getTime() + minutes * 60000);
                text = ('0' + dep.getHours()).slice(-2) + ':' + ('0' + dep.getMinutes()).slice(-2);
                unit = '';
            }

            var chars = text.split('');
            var html = '<div class="time-tiles">';
            chars.forEach(function(ch) {
                var w = ch === ':' ? '16px' : '34px';
                html += '<div class="tile" style="width:' + w + '">' + ch + '</div>';
            });
            html += '</div>';
            html += '<div class="time-unit">' + unit + '</div>';
            return html;
        }

        // Message
        function showMsg(text, isError) {
            var el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'msg' + (isError ? ' error' : '');
        }
        function hideMsg() { document.getElementById('msg').className = 'msg hidden'; }

        // API request
        function apiGet(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try { callback(null, JSON.parse(xhr.responseText)); }
                        catch(e) { callback('Invalid response', null); }
                    } else {
                        callback('Request failed', null);
                    }
                }
            };
            xhr.open('GET', url, true);
            xhr.send();
        }

        // Search stops
        function doSearch() {
            var query = document.getElementById('searchInput').value.trim();
            if (!query) { showMsg('Enter a stop name', true); return; }

            showMsg('Searching...', false);
            hide('stopList');

            apiGet('/api/stops?q=' + encodeURIComponent(query), function(err, data) {
                if (err) { showMsg('Search failed: ' + err, true); return; }
                if (!data.stops || data.stops.length === 0) { showMsg('No stops found', true); return; }

                showMsg('Found ' + data.stops.length + ' stops', false);

                var list = document.getElementById('stopList');
                list.innerHTML = '';

                data.stops.forEach(function(stop) {
                    var div = document.createElement('div');
                    div.className = 'stop-item';
                    var modesText = stop.modeNames ? ' · ' + stop.modeNames : '';
                    div.innerHTML = '<div class="stop-name">' + stop.name + '</div>' +
                        '<div class="stop-parent">' + (stop.parent || '') + modesText + '</div>';
                    div.onclick = function() { selectStop(stop, div); };
                    list.appendChild(div);
                });

                show('stopList');
            });
        }

        // Select stop
        function selectStop(stop, el) {
            selectedStop = stop;
            document.getElementById('selectedStop').value = stop.name + (stop.parent ? ' (' + stop.parent + ')' : '');

            document.querySelectorAll('.stop-item').forEach(function(item) {
                item.classList.remove('selected');
            });
            el.classList.add('selected');

            showMsg('Selected: ' + stop.name, false);
        }

        // Update mode filter UI
        function updateModeFilters() {
            document.querySelectorAll('.mode-filter').forEach(function(filter) {
                var mode = filter.dataset.mode;
                var checkbox = filter.querySelector('input');
                var isChecked = config.modes.indexOf(mode) !== -1;
                checkbox.checked = isChecked;
                filter.classList.toggle('checked', isChecked);
            });
        }

        // Setup mode filters
        function setupModeFilters() {
            document.querySelectorAll('.mode-filter').forEach(function(filter) {
                filter.onclick = function(e) {
                    if (e.target.tagName === 'INPUT') return;
                    var checkbox = filter.querySelector('input');
                    checkbox.checked = !checkbox.checked;
                    filter.classList.toggle('checked', checkbox.checked);
                };
            });
        }

        // Get selected modes
        function getSelectedModes() {
            var modes = [];
            document.querySelectorAll('.mode-filter').forEach(function(filter) {
                if (filter.querySelector('input').checked) {
                    modes.push(filter.dataset.mode);
                }
            });
            return modes;
        }

        // Save settings
        function saveSettings() {
            if (!selectedStop && !config.stopId) {
                showMsg('Please select a stop first', true);
                return;
            }

            if (selectedStop) {
                config.stopId = selectedStop.id;
                config.stopName = selectedStop.name.split(',')[0].toUpperCase();
                config.stopDetail = selectedStop.parent || selectedStop.name;
            }
            config.modes = getSelectedModes();

            if (config.modes.length === 0) {
                showMsg('Select at least one transport type', true);
                return;
            }

            saveConfig();
            closeSettings();
            fetchDepartures();
        }

        // Settings panel
        function openSettings() {
            hideMsg();
            document.getElementById('searchInput').value = '';
            document.getElementById('selectedStop').value = config.stopName || '';
            hide('stopList');
            selectedStop = null;
            updateModeFilters();
            document.getElementById('settings').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settings').classList.remove('show');
        }

        // Get mode key for filtering
        function getModeKey(modeCode) {
            var mode = MODES[modeCode];
            return mode ? mode.key : 'bus';
        }

        // Fetch departures
        function fetchDepartures() {
            if (!config.stopId) {
                hide('loading');
                hide('error');
                show('noConfig');
                document.getElementById('headerStopName').textContent = 'NO STOP';
                document.getElementById('headerStopDetail').textContent = 'TAP ⚙ TO CONFIGURE';
                return;
            }

            document.getElementById('headerStopName').textContent = config.stopName || 'LOADING';
            document.getElementById('headerStopDetail').textContent = config.stopDetail || '';

            apiGet('/api/departures?stopId=' + encodeURIComponent(config.stopId), function(err, data) {
                hide('loading');
                hide('noConfig');

                if (err) {
                    document.getElementById('error').textContent = err.toUpperCase();
                    show('error');
                    return;
                }

                if (!data.departures || data.departures.length === 0) {
                    document.getElementById('error').textContent = 'NO DEPARTURES';
                    show('error');
                    return;
                }

                // Filter by selected modes
                var filtered = data.departures.filter(function(dep) {
                    return config.modes.indexOf(dep.modeKey) !== -1;
                });

                if (filtered.length === 0) {
                    document.getElementById('error').textContent = 'NO ' + config.modes.join('/').toUpperCase() + ' SERVICE';
                    show('error');
                    return;
                }

                displayDepartures(filtered);
            });
        }

        // Display departures
        function displayDepartures(departures) {
            currentDepartures = departures;
            hide('loading');
            hide('error');
            hide('noConfig');

            var rowsEl = document.getElementById('rows');
            rowsEl.innerHTML = '';

            // Show up to 5 rows
            var count = Math.min(5, departures.length);
            for (var i = 0; i < count; i++) {
                var dep = departures[i];
                var row = document.createElement('div');
                row.className = 'row';

                var statusClass = dep.isRealtime ? 'live' : 'timetable';
                var statusText = dep.isRealtime ? 'LIVE' : 'TIMETABLE';

                // Add occupancy to status if available
                if (dep.occupancy && dep.occupancyLevel > 0) {
                    statusText += ' · ' + dep.occupancy.toUpperCase();
                }

                row.innerHTML =
                    '<div class="route-tiles">' + createRouteTiles(dep.route) + '</div>' +
                    '<div class="dest-info">' +
                        '<div class="dest-name">' + (dep.destination || 'UNKNOWN').toUpperCase() + '</div>' +
                        '<div class="dest-status"><span class="status-dot ' + statusClass + '"></span>' + statusText + '</div>' +
                    '</div>' +
                    '<div class="time-display">' + createTimeTiles(dep.minutes) + '</div>';

                rowsEl.appendChild(row);
            }

            document.getElementById('updated').textContent = formatTime();
            updateClock();
        }

        // E-ink full refresh (clear ghosting)
        function flashRefresh() {
            document.body.style.background = '#000';
            setTimeout(function() {
                document.body.style.background = '#fff';
            }, 150);
        }

        // Initialize
        function init() {
            loadConfig();
            setupModeFilters();
            updateClock();

            if (config.stopId) {
                document.getElementById('headerStopName').textContent = config.stopName || 'LOADING';
                document.getElementById('headerStopDetail').textContent = config.stopDetail || '';
                fetchDepartures();
            } else {
                hide('loading');
                show('noConfig');
            }

            // Update clock every second
            setInterval(updateClock, 1000);

            // Refresh departures every 15 seconds
            setInterval(fetchDepartures, 15000);

            // E-ink full refresh every 10 minutes
            setInterval(flashRefresh, 600000);

            document.getElementById('searchInput').onkeypress = function(e) {
                if (e.key === 'Enter') doSearch();
            };
        }

        init();
    </script>
</body>
</html>
