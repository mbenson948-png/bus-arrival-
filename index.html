<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFFFFF">
    <title>Bus Arrivals</title>
    <style>
        /* Reset and Base */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: none !important;
            animation: none !important;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            scroll-behavior: auto !important;
        }

        body {
            font-family: Arial, system-ui, sans-serif;
            background-color: #FFFFFF;
            color: #000000;
            display: flex;
            flex-direction: column;
        }

        /* Flash Overlay for E-Ink Refresh */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
            display: none;
        }

        #flash-overlay.flash-black {
            display: block;
            background-color: #000000;
        }

        #flash-overlay.flash-white {
            display: block;
            background-color: #FFFFFF;
        }

        /* Main Container */
        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding: 16px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #000000;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #settings-btn {
            width: 40px;
            height: 40px;
            background-color: #FFFFFF;
            border: 3px solid #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* Loading State */
        #loading {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 4px;
        }

        /* Error State */
        #error {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            padding: 20px;
            border: 4px solid #000000;
            display: none;
        }

        /* Arrivals Container */
        #arrivals {
            flex: 1;
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        /* Next Bus - Primary Display */
        .arrival-primary {
            flex: 2;
            border: 4px solid #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .arrival-primary .route {
            font-size: 4rem;
            font-weight: bold;
            line-height: 1;
        }

        .arrival-primary .time {
            font-size: 3rem;
            font-weight: bold;
            margin-top: 8px;
        }

        .arrival-primary .occupancy {
            font-size: 1.25rem;
            font-weight: bold;
            margin-top: 12px;
            padding: 8px 16px;
            background-color: #000000;
            color: #FFFFFF;
            text-transform: uppercase;
        }

        /* Secondary Arrivals */
        .arrivals-secondary {
            flex: 1;
            display: flex;
            gap: 12px;
        }

        .arrival-secondary {
            flex: 1;
            border: 3px solid #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
            text-align: center;
        }

        .arrival-secondary .route {
            font-size: 2rem;
            font-weight: bold;
            line-height: 1;
        }

        .arrival-secondary .time {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .arrival-secondary .occupancy {
            font-size: 0.875rem;
            font-weight: bold;
            margin-top: 8px;
            padding: 4px 8px;
            background-color: #000000;
            color: #FFFFFF;
            text-transform: uppercase;
        }

        /* Footer */
        footer {
            border-top: 2px solid #000000;
            padding-top: 8px;
            margin-top: 12px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Settings Overlay */
        #settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            z-index: 1000;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        #settings-overlay.visible {
            display: flex;
        }

        #settings-overlay h2 {
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 4px solid #000000;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: 3px solid #000000;
            background-color: #FFFFFF;
            color: #000000;
            outline: none;
            border-radius: 0;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }

        .form-group select {
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }

        .form-group input::placeholder {
            color: #000000;
            opacity: 0.5;
        }

        .form-group input:disabled, .form-group select:disabled {
            opacity: 0.5;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .input-row input {
            flex: 1;
        }

        .input-row .btn {
            flex: 0 0 auto;
            padding: 12px 16px;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: auto;
            padding-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border: 3px solid #000000;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #000000;
            color: #FFFFFF;
        }

        .btn-secondary {
            background-color: #FFFFFF;
            color: #000000;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Status Messages */
        .status-msg {
            padding: 10px;
            font-size: 0.875rem;
            font-weight: bold;
            text-align: center;
            border: 3px solid #000000;
            margin-bottom: 16px;
            display: none;
        }

        .status-msg.visible {
            display: block;
        }

        .status-msg.success {
            background-color: #FFFFFF;
            color: #000000;
        }

        .status-msg.error {
            background-color: #000000;
            color: #FFFFFF;
        }

        .status-msg.loading {
            background-color: #FFFFFF;
            color: #000000;
        }

        /* Section divider */
        .section-divider {
            border-top: 2px solid #000000;
            margin: 16px 0;
            padding-top: 16px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            opacity: 0.7;
        }

        /* No Config State */
        #no-config {
            flex: 1;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        #no-config p {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Flash Overlay for E-Ink Anti-Ghosting -->
    <div id="flash-overlay"></div>

    <!-- Settings Overlay -->
    <div id="settings-overlay">
        <h2>Settings</h2>

        <!-- Status Message -->
        <div id="settings-status" class="status-msg"></div>

        <!-- API Key Section -->
        <div class="form-group">
            <label for="api-key">TfNSW API Key</label>
            <div class="input-row">
                <input type="text" id="api-key" placeholder="Enter your API key">
                <button class="btn btn-secondary" id="test-btn">Test</button>
            </div>
        </div>

        <div class="section-divider">
            <div class="section-title">Find Your Bus Stop</div>
        </div>

        <!-- Suburb Search -->
        <div class="form-group">
            <label for="suburb-input">Search Suburb or Street</label>
            <div class="input-row">
                <input type="text" id="suburb-input" placeholder="e.g., Chatswood, George St">
                <button class="btn btn-secondary" id="search-btn">Search</button>
            </div>
        </div>

        <!-- Stop Dropdown -->
        <div class="form-group">
            <label for="stop-select">Select Bus Stop</label>
            <select id="stop-select" disabled>
                <option value="">-- Search for stops first --</option>
            </select>
        </div>

        <!-- Selected Stop Display -->
        <div class="form-group">
            <label>Selected Stop ID</label>
            <input type="text" id="stop-id" readonly placeholder="Will be filled when you select a stop">
        </div>

        <div class="btn-row">
            <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
            <button class="btn btn-primary" id="save-btn">Save</button>
        </div>
    </div>

    <!-- Main App -->
    <div id="app">
        <header>
            <h1>Bus Arrivals</h1>
            <button id="settings-btn" aria-label="Settings">&#9881;</button>
        </header>

        <!-- Loading State -->
        <div id="loading">LOADING...</div>

        <!-- Error State -->
        <div id="error"></div>

        <!-- No Configuration State -->
        <div id="no-config">
            <p>Select a bus stop to start</p>
            <button class="btn btn-primary" id="config-btn">Configure</button>
        </div>

        <!-- Arrivals Display -->
        <div id="arrivals">
            <div class="arrival-primary" id="arrival-1">
                <div class="route"></div>
                <div class="time"></div>
                <div class="occupancy"></div>
            </div>
            <div class="arrivals-secondary">
                <div class="arrival-secondary" id="arrival-2">
                    <div class="route"></div>
                    <div class="time"></div>
                    <div class="occupancy"></div>
                </div>
                <div class="arrival-secondary" id="arrival-3">
                    <div class="route"></div>
                    <div class="time"></div>
                    <div class="occupancy"></div>
                </div>
            </div>
        </div>

        <footer>
            <span id="last-updated">Last Updated: --:--</span>
        </footer>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            API_BASE: 'https://api.transport.nsw.gov.au/v1/tp',
            CORS_PROXIES: [
                'https://corsproxy.io/?',
                'https://api.codetabs.com/v1/proxy?quest='
            ],
            DEFAULT_API_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI3WFd4ZS1RX096RllLaWs4XzRXN3ZyZnhmTHVWWllQellFSlRDYTBsVmJnIiwiaWF0IjoxNzY5NzQ5ODY4fQ.58E1f6Al3k94VGJilfZBE6QjTQVfmcZ1QRbmi8n8NDQ',
            REFRESH_INTERVAL: 60000,
            FLASH_INTERVAL: 300000,
            FLASH_DURATION: 150
        };

        // State
        let state = {
            apiKey: localStorage.getItem('tfnsw_api_key') || CONFIG.DEFAULT_API_KEY,
            stopId: localStorage.getItem('tfnsw_stop_id') || '',
            stopName: localStorage.getItem('tfnsw_stop_name') || '',
            refreshTimer: null,
            flashTimer: null,
            foundStops: []
        };

        // DOM Elements
        const elements = {
            flashOverlay: document.getElementById('flash-overlay'),
            settingsOverlay: document.getElementById('settings-overlay'),
            settingsBtn: document.getElementById('settings-btn'),
            cancelBtn: document.getElementById('cancel-btn'),
            saveBtn: document.getElementById('save-btn'),
            configBtn: document.getElementById('config-btn'),
            testBtn: document.getElementById('test-btn'),
            searchBtn: document.getElementById('search-btn'),
            apiKeyInput: document.getElementById('api-key'),
            suburbInput: document.getElementById('suburb-input'),
            stopSelect: document.getElementById('stop-select'),
            stopIdInput: document.getElementById('stop-id'),
            settingsStatus: document.getElementById('settings-status'),
            loading: document.getElementById('loading'),
            error: document.getElementById('error'),
            noConfig: document.getElementById('no-config'),
            arrivals: document.getElementById('arrivals'),
            lastUpdated: document.getElementById('last-updated')
        };

        // Occupancy mapping
        const OCCUPANCY_MAP = {
            'MANY_SEATS': 'Many Seats',
            'FEW_SEATS': 'Few Seats',
            'STANDING_ROOM': 'Standing Room',
            'LIMITED_STANDING': 'Limited Standing',
            'FULL': 'Full',
            'UNKNOWN': 'Unknown'
        };

        // Show status message in settings
        function showSettingsStatus(message, type) {
            elements.settingsStatus.textContent = message;
            elements.settingsStatus.className = `status-msg visible ${type}`;
        }

        function hideSettingsStatus() {
            elements.settingsStatus.className = 'status-msg';
        }

        // API fetch helper with CORS proxy fallback
        async function apiFetch(endpoint, apiKey) {
            const apiUrl = `${CONFIG.API_BASE}${endpoint}`;
            let response = null;
            let lastError = null;

            // Try direct fetch first
            try {
                response = await fetch(apiUrl, {
                    headers: {
                        'Authorization': `apikey ${apiKey}`,
                        'Accept': 'application/json'
                    }
                });
                if (response.ok) {
                    return await response.json();
                }
            } catch (directError) {
                console.log('Direct fetch failed:', directError.message);
            }

            // Try CORS proxies
            for (const proxy of CONFIG.CORS_PROXIES) {
                try {
                    const proxyUrl = proxy.includes('codetabs')
                        ? proxy + encodeURIComponent(apiUrl)
                        : proxy + apiUrl;
                    console.log('Trying proxy:', proxy);

                    response = await fetch(proxyUrl, {
                        headers: {
                            'Authorization': `apikey ${apiKey}`,
                            'Accept': 'application/json'
                        }
                    });

                    if (response.ok) {
                        console.log('Proxy successful:', proxy);
                        return await response.json();
                    }
                } catch (proxyError) {
                    lastError = proxyError;
                    console.log('Proxy failed:', proxy, proxyError.message);
                }
            }

            throw lastError || new Error('All fetch attempts failed');
        }

        // Test API connection
        async function testConnection() {
            const apiKey = elements.apiKeyInput.value.trim();
            if (!apiKey) {
                showSettingsStatus('Please enter an API key', 'error');
                return;
            }

            elements.testBtn.disabled = true;
            showSettingsStatus('Testing connection...', 'loading');

            try {
                // Use stop_finder with a known location to test
                const params = new URLSearchParams({
                    outputFormat: 'rapidJSON',
                    type_sf: 'any',
                    name_sf: 'Sydney',
                    coordOutputFormat: 'EPSG:4326',
                    TfNSWSF: 'true',
                    version: '10.2.1.42'
                });

                await apiFetch(`/stop_finder?${params}`, apiKey);
                showSettingsStatus('Connection successful!', 'success');
            } catch (error) {
                console.error('Connection test failed:', error);
                showSettingsStatus('Connection failed: ' + error.message, 'error');
            } finally {
                elements.testBtn.disabled = false;
            }
        }

        // Search for stops by suburb/location
        async function searchStops() {
            const searchTerm = elements.suburbInput.value.trim();
            const apiKey = elements.apiKeyInput.value.trim();

            if (!searchTerm) {
                showSettingsStatus('Please enter a suburb or street name', 'error');
                return;
            }

            if (!apiKey) {
                showSettingsStatus('Please enter an API key first', 'error');
                return;
            }

            elements.searchBtn.disabled = true;
            elements.stopSelect.disabled = true;
            showSettingsStatus('Searching for stops...', 'loading');

            try {
                const params = new URLSearchParams({
                    outputFormat: 'rapidJSON',
                    type_sf: 'any',
                    name_sf: searchTerm,
                    coordOutputFormat: 'EPSG:4326',
                    TfNSWSF: 'true',
                    version: '10.2.1.42'
                });

                const data = await apiFetch(`/stop_finder?${params}`, apiKey);

                // Filter for bus stops only
                const stops = (data.locations || []).filter(loc => {
                    const isBusStop = loc.type === 'stop' || loc.type === 'platform';
                    const hasBusMode = loc.productClasses && loc.productClasses.includes(5);
                    return isBusStop || hasBusMode;
                });

                if (stops.length === 0) {
                    showSettingsStatus('No bus stops found. Try a different search.', 'error');
                    elements.stopSelect.innerHTML = '<option value="">-- No stops found --</option>';
                    state.foundStops = [];
                } else {
                    state.foundStops = stops;
                    populateStopDropdown(stops);
                    showSettingsStatus(`Found ${stops.length} bus stop(s)`, 'success');
                    elements.stopSelect.disabled = false;
                }
            } catch (error) {
                console.error('Stop search failed:', error);
                showSettingsStatus('Search failed: ' + error.message, 'error');
                state.foundStops = [];
            } finally {
                elements.searchBtn.disabled = false;
            }
        }

        // Populate stop dropdown
        function populateStopDropdown(stops) {
            elements.stopSelect.innerHTML = '<option value="">-- Select a stop --</option>';

            stops.forEach((stop, index) => {
                const option = document.createElement('option');
                option.value = index;

                // Build display name
                const name = stop.disassembledName || stop.name || 'Unknown Stop';
                const parent = stop.parent?.name || '';
                const id = stop.id || '';

                option.textContent = parent ? `${name} (${parent})` : name;
                option.dataset.stopId = id;
                option.dataset.stopName = name;

                elements.stopSelect.appendChild(option);
            });
        }

        // Handle stop selection
        function onStopSelected() {
            const selectedIndex = elements.stopSelect.value;

            if (selectedIndex === '' || !state.foundStops[selectedIndex]) {
                elements.stopIdInput.value = '';
                return;
            }

            const stop = state.foundStops[selectedIndex];
            const stopId = stop.id || '';
            const stopName = stop.disassembledName || stop.name || '';

            elements.stopIdInput.value = stopId;
            state.stopId = stopId;
            state.stopName = stopName;
        }

        // Flash refresh for e-ink anti-ghosting
        function performFlashRefresh() {
            elements.flashOverlay.className = 'flash-black';
            setTimeout(() => {
                elements.flashOverlay.className = 'flash-white';
                setTimeout(() => {
                    elements.flashOverlay.className = '';
                    elements.flashOverlay.style.display = 'none';
                }, CONFIG.FLASH_DURATION);
            }, CONFIG.FLASH_DURATION);
        }

        // Format date for API
        function formatDateForAPI() {
            const now = new Date();
            const date = now.getFullYear().toString() +
                        (now.getMonth() + 1).toString().padStart(2, '0') +
                        now.getDate().toString().padStart(2, '0');
            const time = now.getHours().toString().padStart(2, '0') +
                        now.getMinutes().toString().padStart(2, '0');
            return { date, time };
        }

        // Calculate minutes until arrival
        function calculateMinutes(departureTime) {
            const now = new Date();
            const [hours, minutes] = departureTime.split(':').map(Number);
            const departure = new Date(now);
            departure.setHours(hours, minutes, 0, 0);

            if (departure < now) {
                departure.setDate(departure.getDate() + 1);
            }

            const diffMs = departure - now;
            const diffMins = Math.round(diffMs / 60000);
            return diffMins;
        }

        // Format arrival time display
        function formatArrivalTime(minutes) {
            if (minutes <= 0) return 'NOW';
            if (minutes === 1) return '1 MIN';
            return `${minutes} MIN`;
        }

        // Parse occupancy from API response
        function parseOccupancy(stopEvent) {
            if (stopEvent.occupancy) {
                return OCCUPANCY_MAP[stopEvent.occupancy] || stopEvent.occupancy;
            }
            return 'Unknown';
        }

        // Parse departure from API response
        function parseDeparture(stopEvent) {
            const transportation = stopEvent.transportation || {};
            const routeNumber = transportation.number || transportation.disassembledName || 'N/A';

            let departureTime;
            if (stopEvent.departureTimeEstimated) {
                const estimated = new Date(stopEvent.departureTimeEstimated);
                departureTime = estimated.getHours().toString().padStart(2, '0') + ':' +
                               estimated.getMinutes().toString().padStart(2, '0');
            } else if (stopEvent.departureTimePlanned) {
                const planned = new Date(stopEvent.departureTimePlanned);
                departureTime = planned.getHours().toString().padStart(2, '0') + ':' +
                               planned.getMinutes().toString().padStart(2, '0');
            } else {
                departureTime = '00:00';
            }

            const minutes = calculateMinutes(departureTime);
            const occupancy = parseOccupancy(stopEvent);

            return {
                route: routeNumber,
                minutes: minutes,
                timeDisplay: formatArrivalTime(minutes),
                occupancy: occupancy
            };
        }

        // Fetch departures from API
        async function fetchDepartures() {
            if (!state.apiKey || !state.stopId) {
                showNoConfig();
                return;
            }

            showLoading();

            const { date, time } = formatDateForAPI();
            const params = new URLSearchParams({
                outputFormat: 'rapidJSON',
                type_dm: 'stop',
                name_dm: state.stopId,
                itdDate: date,
                itdTime: time,
                mode: 'direct',
                TfNSWDM: 'true',
                departureMonitorMacro: 'true',
                limit: '3'
            });

            try {
                const data = await apiFetch(`/departure_mon?${params}`, state.apiKey);

                if (!data.stopEvents || data.stopEvents.length === 0) {
                    showError('No departures found');
                    return;
                }

                const departures = data.stopEvents
                    .slice(0, 3)
                    .map(parseDeparture)
                    .filter(d => d.minutes >= 0);

                if (departures.length === 0) {
                    showError('No upcoming departures');
                    return;
                }

                displayArrivals(departures);

            } catch (error) {
                console.error('Fetch error:', error);
                showError(error.message || 'Failed to fetch data');
            }
        }

        // Display arrivals
        function displayArrivals(departures) {
            hideAllStates();
            elements.arrivals.style.display = 'flex';

            const primary = document.getElementById('arrival-1');
            if (departures[0]) {
                primary.querySelector('.route').textContent = departures[0].route;
                primary.querySelector('.time').textContent = departures[0].timeDisplay;
                primary.querySelector('.occupancy').textContent = departures[0].occupancy;
                primary.style.display = 'flex';
            } else {
                primary.style.display = 'none';
            }

            for (let i = 1; i <= 2; i++) {
                const secondary = document.getElementById(`arrival-${i + 1}`);
                if (departures[i]) {
                    secondary.querySelector('.route').textContent = departures[i].route;
                    secondary.querySelector('.time').textContent = departures[i].timeDisplay;
                    secondary.querySelector('.occupancy').textContent = departures[i].occupancy;
                    secondary.style.display = 'flex';
                } else {
                    secondary.style.display = 'none';
                }
            }

            updateTimestamp();
        }

        // Update last updated timestamp
        function updateTimestamp() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' +
                           now.getMinutes().toString().padStart(2, '0');
            elements.lastUpdated.textContent = `Last Updated: ${timeStr}`;
        }

        // State display helpers
        function hideAllStates() {
            elements.loading.style.display = 'none';
            elements.error.style.display = 'none';
            elements.noConfig.style.display = 'none';
            elements.arrivals.style.display = 'none';
        }

        function showLoading() {
            hideAllStates();
            elements.loading.style.display = 'flex';
        }

        function showError(message) {
            hideAllStates();
            elements.error.textContent = message;
            elements.error.style.display = 'flex';
            updateTimestamp();
        }

        function showNoConfig() {
            hideAllStates();
            elements.noConfig.style.display = 'flex';
        }

        // Settings management
        function openSettings() {
            elements.apiKeyInput.value = state.apiKey;
            elements.stopIdInput.value = state.stopId;
            elements.suburbInput.value = '';
            elements.stopSelect.innerHTML = '<option value="">-- Search for stops first --</option>';
            elements.stopSelect.disabled = true;
            hideSettingsStatus();
            elements.settingsOverlay.classList.add('visible');
        }

        function closeSettings() {
            elements.settingsOverlay.classList.remove('visible');
        }

        function saveSettings() {
            const apiKey = elements.apiKeyInput.value.trim();
            const stopId = elements.stopIdInput.value.trim();

            if (!apiKey) {
                showSettingsStatus('Please enter an API key', 'error');
                return;
            }

            if (!stopId) {
                showSettingsStatus('Please select a bus stop', 'error');
                return;
            }

            state.apiKey = apiKey;
            state.stopId = stopId;
            localStorage.setItem('tfnsw_api_key', apiKey);
            localStorage.setItem('tfnsw_stop_id', stopId);
            localStorage.setItem('tfnsw_stop_name', state.stopName);

            closeSettings();
            fetchDepartures();
        }

        // Initialize timers
        function startTimers() {
            if (state.refreshTimer) clearInterval(state.refreshTimer);
            if (state.flashTimer) clearInterval(state.flashTimer);

            state.refreshTimer = setInterval(fetchDepartures, CONFIG.REFRESH_INTERVAL);
            state.flashTimer = setInterval(performFlashRefresh, CONFIG.FLASH_INTERVAL);
        }

        // Event listeners
        function setupEventListeners() {
            elements.settingsBtn.addEventListener('click', openSettings);
            elements.cancelBtn.addEventListener('click', closeSettings);
            elements.saveBtn.addEventListener('click', saveSettings);
            elements.configBtn.addEventListener('click', openSettings);
            elements.testBtn.addEventListener('click', testConnection);
            elements.searchBtn.addEventListener('click', searchStops);
            elements.stopSelect.addEventListener('change', onStopSelected);

            // Enter key handlers
            elements.suburbInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchStops();
            });
            elements.apiKeyInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') testConnection();
            });
        }

        // Initialize app
        function init() {
            setupEventListeners();
            startTimers();

            if (state.apiKey && state.stopId) {
                fetchDepartures();
            } else {
                showNoConfig();
            }
        }

        // Start the app
        init();
    </script>
</body>
</html>
