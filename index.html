<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus</title>
    <style>
        /* Simple reset */
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #000;
            padding: 10px;
        }

        /* Header */
        .header {
            border-bottom: 3px solid #000;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: bold;
        }

        /* Primary bus - big display */
        .bus-primary {
            border: 4px solid #000;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
        }

        .bus-primary .route {
            font-size: 72px;
            font-weight: bold;
            line-height: 1;
        }

        .bus-primary .time {
            font-size: 48px;
            font-weight: bold;
            margin-top: 10px;
        }

        .bus-primary .status {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            padding: 5px 10px;
            background: #000;
            color: #fff;
            display: inline-block;
        }

        /* Secondary buses */
        .bus-secondary {
            border: 3px solid #000;
            padding: 10px;
            margin-bottom: 10px;
        }

        .bus-secondary .route {
            font-size: 36px;
            font-weight: bold;
            display: inline-block;
            width: 100px;
        }

        .bus-secondary .time {
            font-size: 28px;
            font-weight: bold;
            display: inline-block;
        }

        .bus-secondary .status {
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
            padding: 3px 8px;
            background: #000;
            color: #fff;
            display: inline-block;
        }

        /* Footer */
        .footer {
            border-top: 2px solid #000;
            padding-top: 8px;
            margin-top: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Messages */
        .message {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding: 40px 20px;
            border: 3px solid #000;
        }

        /* Settings */
        .settings {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #fff;
            padding: 15px;
        }

        .settings.show {
            display: block;
        }

        .settings h2 {
            font-size: 20px;
            border-bottom: 3px solid #000;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        .settings label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            margin-top: 15px;
        }

        .settings input, .settings select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #000;
            background: #fff;
            margin-bottom: 10px;
        }

        .settings button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: 3px solid #000;
            background: #000;
            color: #fff;
            margin-right: 10px;
            margin-top: 15px;
        }

        .settings button.cancel {
            background: #fff;
            color: #000;
        }

        .gear {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border: 2px solid #000;
            text-align: center;
            line-height: 26px;
            font-size: 20px;
            cursor: pointer;
        }

        .status-text {
            font-size: 14px;
            font-weight: bold;
            padding: 8px;
            border: 2px solid #000;
            margin-bottom: 10px;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Settings Panel -->
    <div id="settings" class="settings">
        <h2>SETTINGS</h2>

        <div id="statusText" class="status-text hidden"></div>

        <label>API KEY</label>
        <input type="text" id="apiKey">

        <label>STOP ID (6-7 digits)</label>
        <input type="text" id="stopId" maxlength="7">

        <label>Or search by suburb:</label>
        <input type="text" id="searchInput" placeholder="e.g. Chatswood">
        <button type="button" onclick="searchStops()">SEARCH</button>

        <label>Select stop:</label>
        <select id="stopSelect" disabled>
            <option value="">-- Search first --</option>
        </select>

        <div>
            <button type="button" onclick="testApi()">TEST</button>
            <button type="button" onclick="saveSettings()">SAVE</button>
            <button type="button" class="cancel" onclick="closeSettings()">CANCEL</button>
        </div>
    </div>

    <!-- Main Display -->
    <div id="main">
        <div class="header">
            <h1>BUS ARRIVALS</h1>
            <div class="gear" onclick="openSettings()">&#9881;</div>
        </div>

        <div id="content">
            <div id="loading" class="message">LOADING...</div>
            <div id="error" class="message hidden"></div>
            <div id="noConfig" class="message hidden">TAP GEAR TO CONFIGURE</div>

            <div id="buses" class="hidden">
                <div id="bus1" class="bus-primary">
                    <div class="route">--</div>
                    <div class="time">-- MIN</div>
                    <div class="status">--</div>
                </div>
                <div id="bus2" class="bus-secondary">
                    <span class="route">--</span>
                    <span class="time">-- MIN</span>
                    <div class="status">--</div>
                </div>
                <div id="bus3" class="bus-secondary">
                    <span class="route">--</span>
                    <span class="time">-- MIN</span>
                    <div class="status">--</div>
                </div>
            </div>
        </div>

        <div class="footer">
            UPDATED: <span id="updated">--:--</span>
        </div>
    </div>

    <script>
        // Configuration
        var API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJQWFh6Q1I4OVd3bUlweTdldzZHbnRFcXV3azJXNW1NQXZ6d3BlX19aVkRVIiwiaWF0IjoxNzk0ODk4Mjg1fQ.V7JCyJnsy0AfhWytEZDVGDc_OEXavXHFScxX4E34WQM';
        var API_BASE = 'https://api.transport.nsw.gov.au/v1/tp';
        var PROXY_URL = '/api'; // Local proxy server
        var REFRESH_MS = 60000; // 1 minute
        var FLASH_MS = 300000; // 5 minutes

        var stopId = '';
        var apiKey = API_KEY;
        var foundStops = [];
        var refreshTimer = null;
        var flashTimer = null;

        // Load saved settings
        function loadSettings() {
            try {
                var saved = localStorage.getItem('bus_settings');
                if (saved) {
                    var data = JSON.parse(saved);
                    stopId = data.stopId || '';
                    apiKey = data.apiKey || API_KEY;
                }
            } catch (e) {}
        }

        // Save settings
        function saveToStorage() {
            try {
                localStorage.setItem('bus_settings', JSON.stringify({
                    stopId: stopId,
                    apiKey: apiKey
                }));
            } catch (e) {}
        }

        // Show/hide elements
        function show(id) {
            document.getElementById(id).className = document.getElementById(id).className.replace(' hidden', '');
        }

        function hide(id) {
            var el = document.getElementById(id);
            if (el.className.indexOf('hidden') === -1) {
                el.className += ' hidden';
            }
        }

        // Format time
        function formatTime() {
            var d = new Date();
            var h = d.getHours();
            var m = d.getMinutes();
            return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
        }

        // Calculate minutes until arrival
        function calcMinutes(timeStr) {
            var now = new Date();
            var parts = timeStr.split(':');
            var h = parseInt(parts[0], 10);
            var m = parseInt(parts[1], 10);
            var arrival = new Date(now);
            arrival.setHours(h, m, 0, 0);
            if (arrival < now) {
                arrival.setDate(arrival.getDate() + 1);
            }
            return Math.round((arrival - now) / 60000);
        }

        // Format date for API
        function getDateParams() {
            var d = new Date();
            var date = d.getFullYear() +
                ('0' + (d.getMonth() + 1)).slice(-2) +
                ('0' + d.getDate()).slice(-2);
            var time = ('0' + d.getHours()).slice(-2) +
                ('0' + d.getMinutes()).slice(-2);
            return { date: date, time: time };
        }

        // Make API request (uses local proxy to avoid CORS)
        function apiRequest(endpoint, callback) {
            var xhr = new XMLHttpRequest();
            var url = PROXY_URL + endpoint;

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(null, data);
                        } catch (e) {
                            callback('Invalid response', null);
                        }
                    } else {
                        callback('Request failed: ' + xhr.status, null);
                    }
                }
            };

            xhr.open('GET', url, true);
            xhr.setRequestHeader('X-API-Key', apiKey);
            xhr.send();
        }

        // Map occupancy codes
        function mapOccupancy(code) {
            var map = {
                'MANY_SEATS': 'MANY SEATS',
                'FEW_SEATS': 'FEW SEATS',
                'STANDING_ROOM': 'STANDING',
                'LIMITED_STANDING': 'CROWDED',
                'FULL': 'FULL'
            };
            return map[code] || 'UNKNOWN';
        }

        // Parse departure data
        function parseDeparture(event) {
            var transport = event.transportation || {};
            var route = transport.number || transport.disassembledName || '?';

            var timeStr = '00:00';
            if (event.departureTimeEstimated) {
                var d = new Date(event.departureTimeEstimated);
                timeStr = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
            } else if (event.departureTimePlanned) {
                var d = new Date(event.departureTimePlanned);
                timeStr = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
            }

            var mins = calcMinutes(timeStr);
            var occupancy = mapOccupancy(event.occupancy);

            return {
                route: route,
                mins: mins,
                occupancy: occupancy
            };
        }

        // Update bus display
        function updateBus(id, data) {
            var el = document.getElementById(id);
            if (!el) return;

            var routeEl = el.getElementsByClassName('route')[0];
            var timeEl = el.getElementsByClassName('time')[0];
            var statusEl = el.getElementsByClassName('status')[0];

            routeEl.innerHTML = data.route;
            timeEl.innerHTML = data.mins <= 0 ? 'NOW' : data.mins + ' MIN';
            statusEl.innerHTML = data.occupancy;
        }

        // Fetch departures
        function fetchDepartures() {
            console.log('fetchDepartures called, stopId:', stopId);

            if (!stopId || !apiKey) {
                console.log('No stopId or apiKey, showing noConfig');
                hide('loading');
                hide('error');
                hide('buses');
                show('noConfig');
                return;
            }

            var dt = getDateParams();
            // Extract numeric part of stop ID if it has a letter prefix
            var numericStopId = stopId.replace(/^[A-Za-z]+/, '');
            console.log('Fetching departures for stop:', stopId, '(numeric:', numericStopId + ')', 'date:', dt.date, 'time:', dt.time);

            var endpoint = '/departure_mon?' +
                'outputFormat=rapidJSON' +
                '&type_dm=stop' +
                '&name_dm=' + encodeURIComponent(numericStopId) +
                '&itdDate=' + dt.date +
                '&itdTime=' + dt.time +
                '&mode=direct' +
                '&TfNSWDM=true' +
                '&departureMonitorMacro=true' +
                '&limit=10';

            show('loading');
            hide('error');
            hide('buses');
            hide('noConfig');

            apiRequest(endpoint, function(err, data) {
                hide('loading');
                console.log('Departure response:', err, JSON.stringify(data, null, 2));

                if (err) {
                    console.log('Error fetching departures:', err);
                    document.getElementById('error').innerHTML = err;
                    show('error');
                    return;
                }

                // Log all keys in response
                console.log('Response keys:', Object.keys(data));

                if (!data.stopEvents || data.stopEvents.length === 0) {
                    console.log('No stopEvents found. Response has:', Object.keys(data));
                    // Check if there's an error message
                    if (data.ErrorDetails) {
                        document.getElementById('error').innerHTML = data.ErrorDetails.Message || 'API ERROR';
                    } else {
                        document.getElementById('error').innerHTML = 'NO BUSES FOUND';
                    }
                    show('error');
                    return;
                }

                console.log('Found', data.stopEvents.length, 'departures');

                var departures = [];
                for (var i = 0; i < Math.min(3, data.stopEvents.length); i++) {
                    var dep = parseDeparture(data.stopEvents[i]);
                    if (dep.mins >= 0) {
                        departures.push(dep);
                    }
                }

                if (departures.length === 0) {
                    document.getElementById('error').innerHTML = 'NO UPCOMING BUSES';
                    show('error');
                    return;
                }

                // Update display
                if (departures[0]) updateBus('bus1', departures[0]);
                if (departures[1]) updateBus('bus2', departures[1]);
                if (departures[2]) updateBus('bus3', departures[2]);

                show('buses');
                document.getElementById('updated').innerHTML = formatTime();
            });
        }

        // E-ink flash refresh
        function flashRefresh() {
            document.body.style.background = '#000';
            setTimeout(function() {
                document.body.style.background = '#fff';
            }, 150);
        }

        // Settings functions
        function openSettings() {
            document.getElementById('apiKey').value = apiKey;
            document.getElementById('stopId').value = stopId;
            document.getElementById('settings').className = 'settings show';
        }

        function closeSettings() {
            document.getElementById('settings').className = 'settings';
        }

        function showStatus(msg, isError) {
            var el = document.getElementById('statusText');
            el.innerHTML = msg;
            el.style.background = isError ? '#000' : '#fff';
            el.style.color = isError ? '#fff' : '#000';
            el.className = 'status-text';
        }

        function hideStatus() {
            document.getElementById('statusText').className = 'status-text hidden';
        }

        function testApi() {
            var key = document.getElementById('apiKey').value;
            if (!key) {
                showStatus('ENTER API KEY', true);
                return;
            }

            showStatus('TESTING...', false);
            apiKey = key;

            var endpoint = '/stop_finder?' +
                'outputFormat=rapidJSON' +
                '&type_sf=any' +
                '&name_sf=Sydney' +
                '&TfNSWSF=true';

            apiRequest(endpoint, function(err, data) {
                if (err) {
                    showStatus('FAILED: ' + err, true);
                } else if (data.locations) {
                    showStatus('SUCCESS! Found ' + data.locations.length + ' results', false);
                } else {
                    showStatus('SUCCESS!', false);
                }
            });
        }

        function searchStops() {
            var search = document.getElementById('searchInput').value;
            var key = document.getElementById('apiKey').value;

            if (!search) {
                showStatus('ENTER SUBURB NAME', true);
                return;
            }
            if (!key) {
                showStatus('ENTER API KEY FIRST', true);
                return;
            }

            showStatus('SEARCHING...', false);
            apiKey = key;

            var endpoint = '/stop_finder?' +
                'outputFormat=rapidJSON' +
                '&type_sf=any' +
                '&name_sf=' + encodeURIComponent(search) +
                '&TfNSWSF=true';

            apiRequest(endpoint, function(err, data) {
                if (err) {
                    showStatus('SEARCH FAILED: ' + err, true);
                    return;
                }

                var stops = [];
                var locs = data.locations || [];
                for (var i = 0; i < locs.length; i++) {
                    var loc = locs[i];
                    if (loc.type === 'stop' || loc.type === 'platform') {
                        stops.push(loc);
                    }
                }

                if (stops.length === 0) {
                    showStatus('NO STOPS FOUND', true);
                    return;
                }

                foundStops = stops;
                // Log first stop to see its structure
                console.log('First stop object:', JSON.stringify(stops[0], null, 2));

                var select = document.getElementById('stopSelect');
                select.innerHTML = '<option value="">-- Select stop --</option>';

                for (var i = 0; i < stops.length; i++) {
                    var s = stops[i];
                    var name = s.disassembledName || s.name || 'Unknown';
                    var parent = (s.parent && s.parent.name) ? ' (' + s.parent.name + ')' : '';
                    var opt = document.createElement('option');
                    opt.value = i;
                    opt.text = name + parent;
                    select.appendChild(opt);
                }

                select.disabled = false;
                select.onchange = function() {
                    var idx = select.value;
                    if (idx !== '' && foundStops[idx]) {
                        document.getElementById('stopId').value = foundStops[idx].id || '';
                    }
                };

                showStatus('FOUND ' + stops.length + ' STOPS', false);
            });
        }

        function saveSettings() {
            var key = document.getElementById('apiKey').value;
            var stop = document.getElementById('stopId').value;

            if (!key) {
                showStatus('ENTER API KEY', true);
                return;
            }
            if (!stop) {
                showStatus('SELECT A STOP', true);
                return;
            }

            apiKey = key;
            stopId = stop;
            saveToStorage();
            closeSettings();
            fetchDepartures();
        }

        // Initialize
        function init() {
            loadSettings();

            if (stopId && apiKey) {
                fetchDepartures();
            } else {
                hide('loading');
                show('noConfig');
            }

            // Auto refresh
            refreshTimer = setInterval(fetchDepartures, REFRESH_MS);

            // E-ink flash refresh
            flashTimer = setInterval(flashRefresh, FLASH_MS);
        }

        // Start
        init();
    </script>
</body>
</html>
